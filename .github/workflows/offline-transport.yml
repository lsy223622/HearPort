name: Offline transport simulation

on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        default: decomposition
        options: [decomposition, sensitivity, components, timing]

jobs:
  simulate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Compile production controllers and offline drivers
        shell: bash
        run: |
          set -euo pipefail
          source_dir=ios/HearPortReceiver/Sources/HearPortReceiver
          python3 diagnostics/prepare_offline_controller.py \
            "$source_dir/PlayoutController.swift" "$RUNNER_TEMP/PlayoutController.swift" \
            "$source_dir/CoordinatedProbe.swift" "$RUNNER_TEMP/CoordinatedProbe.swift" \
            windows/include/hearport/windows/reliable_audio_lag.h \
            "$RUNNER_TEMP/experiment/hearport/windows/reliable_audio_lag.h"
          clang++ -std=c++20 -O2 -I "$RUNNER_TEMP/experiment" -I windows/include -I core/include -c \
            diagnostics/offline_recovery_bridge.cpp -o "$RUNNER_TEMP/recovery-bridge.o"
          swiftc -O \
            "$source_dir/AudioDatagram.swift" \
            "$source_dir/ReceiverModels.swift" \
            "$source_dir/ControlFraming.swift" \
            "$source_dir/ControlMessages.swift" \
            "$RUNNER_TEMP/PlayoutController.swift" \
            "$source_dir/RepairWindow.swift" \
            "$RUNNER_TEMP/CoordinatedProbe.swift" \
            diagnostics/offline_transport.swift \
            -import-objc-header diagnostics/offline_recovery_bridge.h \
            "$RUNNER_TEMP/recovery-bridge.o" -lc++ \
            -o "$RUNNER_TEMP/offline-transport"
          clang++ -std=c++20 -O2 -I windows/include -I core/include \
            diagnostics/offline_recovery.cpp -o "$RUNNER_TEMP/offline-recovery"
      - name: Run deterministic paired scenarios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/offline-results"
          if [ "${{ inputs.phase }}" = sensitivity ]; then
            "$RUNNER_TEMP/offline-transport" "$RUNNER_TEMP/offline-results/sensitivity.json" sensitivity
          elif [ "${{ inputs.phase }}" = components ]; then
            "$RUNNER_TEMP/offline-transport" "$RUNNER_TEMP/offline-results/components.json" components
          elif [ "${{ inputs.phase }}" = timing ]; then
            "$RUNNER_TEMP/offline-transport" "$RUNNER_TEMP/offline-results/timing.json" timing
          else
            "$RUNNER_TEMP/offline-transport" "$RUNNER_TEMP/offline-results/playout.json"
            "$RUNNER_TEMP/offline-transport" "$RUNNER_TEMP/offline-results/ablation.json" ablation
            "$RUNNER_TEMP/offline-recovery" "$RUNNER_TEMP/offline-results/recovery.json"
            python3 -m unittest tests.test_offline_transport_analysis -v
            python3 diagnostics/analyze_offline_transport.py "$RUNNER_TEMP/offline-results"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HearPort-offline-transport
          path: ${{ runner.temp }}/offline-results/
