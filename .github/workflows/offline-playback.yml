name: Offline production playback

on:
  workflow_dispatch:

jobs:
  playback:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        reference: [943523a, 49b8ee5, working]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare virtual clock copy and exercise production playback
        env:
          HEARPORT_PLAYBACK_REFERENCE: ${{ matrix.reference }}
        run: |
          source=ios/HearPortReceiver
          if [ "$HEARPORT_PLAYBACK_REFERENCE" != working ]; then
            mkdir "$RUNNER_TEMP/reference"
            git archive "$HEARPORT_PLAYBACK_REFERENCE" ios/HearPortReceiver | tar -x -C "$RUNNER_TEMP/reference"
            source="$RUNNER_TEMP/reference/ios/HearPortReceiver"
          fi
          python3 diagnostics/prepare_offline_playback.py "$source" "$RUNNER_TEMP/playback"
          HEARPORT_PLAYBACK_RESULTS="$RUNNER_TEMP/playback.json" \
            swift test --package-path "$RUNNER_TEMP/playback" -c release --filter OfflinePlaybackTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HearPort-offline-playback-${{ matrix.reference }}
          path: ${{ runner.temp }}/playback.json

  comparison:
    needs: playback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: HearPort-offline-playback-*
          path: ${{ runner.temp }}/results
      - name: Verify identical inputs and output continuity
        run: |
          unchanged=""
          if git diff --quiet 49b8ee5 HEAD -- ios/HearPortReceiver/Sources; then unchanged=--unchanged; fi
          python3 diagnostics/compare_offline_playback.py "$RUNNER_TEMP/results" $unchanged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HearPort-playback-comparison
          path: ${{ runner.temp }}/results/comparison.json
