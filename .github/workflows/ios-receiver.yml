name: iOS receiver package tests

on:
  push:
    paths:
      - "ios/HearPortReceiver/**"
      - "ios/HearPortApp/**"
      - "diagnostics/offline_clock.swift"
      - "security/spake2-provider/**"
      - "tests/integration/**"
      - ".github/workflows/ios-receiver.yml"
      - "scripts/collect_notices.py"
      - "scripts/fetch_opus.py"
      - "scripts/build_shortcuts.py"
      - "scripts/verify_app_intents.py"
      - "tests/test_shortcuts.py"
      - "tests/test_automation_analysis.py"
      - "diagnostics/analyze_automation.py"
      - "THIRD_PARTY_NOTICES.md"
      - "LICENSE"
  pull_request:
    paths:
      - "ios/HearPortReceiver/**"
      - "ios/HearPortApp/**"
      - "diagnostics/offline_clock.swift"
      - "security/spake2-provider/**"
      - "tests/integration/**"
      - ".github/workflows/ios-receiver.yml"
      - "scripts/collect_notices.py"
      - "scripts/fetch_opus.py"
      - "scripts/build_shortcuts.py"
      - "scripts/verify_app_intents.py"
      - "tests/test_shortcuts.py"
      - "tests/test_automation_analysis.py"
      - "diagnostics/analyze_automation.py"
      - "THIRD_PARTY_NOTICES.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-package:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch pinned Opus source
        run: python3 scripts/fetch_opus.py

      - name: Validate shortcut sources
        run: python3 -m unittest tests.test_shortcuts tests.test_automation_analysis -q

      - name: Build host Opus for Swift package tests
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/opus-host"
          cmake -S ios/HearPortReceiver/Vendor/opus -B "$RUNNER_TEMP/opus-host-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DOPUS_BUILD_SHARED_LIBRARY=OFF \
            -DOPUS_BUILD_TESTING=OFF \
            -DBUILD_TESTING=OFF \
            -DOPUS_BUILD_PROGRAMS=OFF \
            -DOPUS_DRED=OFF \
            -DOPUS_OSCE=OFF
          cmake --build "$RUNNER_TEMP/opus-host-build" --config Release --parallel 4
          cmake --install "$RUNNER_TEMP/opus-host-build"

      - name: Run Swift package tests with QUIC interoperability
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -pthread \
            -I ios/HearPortReceiver/Sources/HearPortAtomics/include \
            ios/HearPortReceiver/Tests/AudioRingCTests.c \
            ios/HearPortReceiver/Sources/HearPortAtomics/AudioRing.c \
            -o "$RUNNER_TEMP/audio-ring-tests"
          "$RUNNER_TEMP/audio-ring-tests"
          python3 -m venv "$RUNNER_TEMP/quic-test"
          "$RUNNER_TEMP/quic-test/bin/pip" install aioquic==1.3.0
          "$RUNNER_TEMP/quic-test/bin/python" -m unittest discover -s tests/integration -p test_usb_packet_bridge.py
          "$RUNNER_TEMP/quic-test/bin/python" -u tests/integration/quic_echo_server.py > "$RUNNER_TEMP/quic-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/quic-server.log"' EXIT
          for attempt in {1..50}; do
            if grep -q quic_test_server_ready "$RUNNER_TEMP/quic-server.log"; then break; fi
            sleep 0.1
          done
          grep -q quic_test_server_ready "$RUNNER_TEMP/quic-server.log"
          swiftc -O ios/HearPortReceiver/Sources/HearPortReceiver/ClockMapping.swift \
            diagnostics/offline_clock.swift -o "$RUNNER_TEMP/offline-clock"
          "$RUNNER_TEMP/offline-clock"
          cd ios/HearPortReceiver
          LIBRARY_PATH="$RUNNER_TEMP/opus-host/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" \
            HEARPORT_QUIC_INTEGRATION=1 swift test -Xlinker -L -Xlinker "$RUNNER_TEMP/opus-host/lib"

  ios-unsigned-ipa:
    needs: swift-package
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch pinned Opus source
        run: python3 scripts/fetch_opus.py

      - name: Build iOS Opus static library
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/ios/HearPortApp/ThirdParty/opus"
          cmake -S ios/HearPortReceiver/Vendor/opus -B out/opus/ios-arm64 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DOPUS_BUILD_SHARED_LIBRARY=OFF \
            -DOPUS_BUILD_TESTING=OFF \
            -DBUILD_TESTING=OFF \
            -DOPUS_BUILD_PROGRAMS=OFF \
            -DOPUS_DRED=OFF \
            -DOPUS_OSCE=OFF
          cmake --build out/opus/ios-arm64 --config Release --parallel 4
          cmake --install out/opus/ios-arm64

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build iOS SPAKE2 provider
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios
          cargo build \
            --manifest-path security/spake2-provider/Cargo.toml \
            --release \
            --target aarch64-apple-ios
          mkdir -p ios/HearPortApp/ThirdParty
          cp security/spake2-provider/target/aarch64-apple-ios/release/libhearport_spake2_provider.a \
            ios/HearPortApp/ThirdParty/
          nm_output="$(nm -arch arm64 -gU \
            ios/HearPortApp/ThirdParty/libhearport_spake2_provider.a 2>&1 || true)"
          printf '%s\n' "$nm_output"
          case "$nm_output" in
            *hearport_spake2_begin*) ;;
            *) echo "SPAKE2 provider symbol not found" >&2; exit 1 ;;
          esac

      - name: Collect bundled license notices
        run: >-
          python3 scripts/collect_notices.py
          --target aarch64-apple-ios
          --output-dir ios/HearPortApp/Resources/ThirdPartyNotices

      - name: Generate Xcode project
        working-directory: ios/HearPortApp
        run: xcodegen generate

      - name: Archive unsigned iOS app
        run: >-
          xcodebuild
          -project ios/HearPortApp/HearPort.xcodeproj
          -scheme HearPort
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/HearPort.xcarchive"
          -derivedDataPath "$RUNNER_TEMP/HearPortDerivedData"
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          HEARPORT_BUILD_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          archive

      - name: Validate archive and create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/HearPort.xcarchive/Products/Applications/HearPort.app"
          test -d "$app_path"
          python3 scripts/verify_app_intents.py "$app_path"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")
          test "$bundle_id" = "com.lsy223622.HearPort"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")
          test "$executable" = "HearPort"
          package_type=$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$app_path/Info.plist")
          test "$package_type" = "APPL"
          app_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")
          build_id=$(/usr/libexec/PlistBuddy -c 'Print :HearPortBuildID' "$app_path/Info.plist")
          test "$app_build" = "$GITHUB_RUN_NUMBER"
          test "$build_id" = "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$app_path" "$RUNNER_TEMP/Payload/HearPort.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/HearPort-unsigned.ipa"
          unzip -l "$RUNNER_TEMP/HearPort-unsigned.ipa" | \
            grep -F "Payload/HearPort.app/Info.plist"
          {
            echo "bundle_identifier=$bundle_id"
            echo "app_build=$app_build"
            echo "app_build_id=$build_id"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "github_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "archive_path=$RUNNER_TEMP/HearPort.xcarchive"
            echo "ipa_sha256=$(shasum -a 256 "$RUNNER_TEMP/HearPort-unsigned.ipa" | awk '{print $1}')"
            xcodebuild -version
            xcodegen --version
          } > "$RUNNER_TEMP/HearPort-archive-metadata.txt"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: HearPort-unsigned-ipa
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/HearPort-unsigned.ipa
            ${{ runner.temp }}/HearPort-archive-metadata.txt

      - name: Build and sign foreground shortcut variants
        run: python3 scripts/build_shortcuts.py --output "$RUNNER_TEMP/HearPort-shortcuts" --sign

      - name: Upload automation test kit
        uses: actions/upload-artifact@v6
        with:
          name: HearPort-shortcuts
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/HearPort-shortcuts/
            docs/connection-automation.md
