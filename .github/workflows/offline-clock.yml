name: Offline clock validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Compile and exercise production clock mapping
        run: |
          swiftc -O ios/HearPortReceiver/Sources/HearPortReceiver/ClockMapping.swift \
            diagnostics/offline_clock.swift -o "$RUNNER_TEMP/offline-clock"
          "$RUNNER_TEMP/offline-clock" "$RUNNER_TEMP/offline-clock.json"
      - name: Run focused clock regression tests
        run: |
          python3 scripts/fetch_opus.py
          cmake -S ios/HearPortReceiver/Vendor/opus -B "$RUNNER_TEMP/opus-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/opus" \
            -DBUILD_SHARED_LIBS=OFF -DOPUS_BUILD_SHARED_LIBRARY=OFF \
            -DBUILD_TESTING=OFF -DOPUS_BUILD_TESTING=OFF -DOPUS_BUILD_PROGRAMS=OFF \
            -DOPUS_DRED=OFF -DOPUS_OSCE=OFF
          cmake --build "$RUNNER_TEMP/opus-build" --parallel 4
          cmake --install "$RUNNER_TEMP/opus-build"
          swift test --package-path ios/HearPortReceiver -Xlinker -L -Xlinker "$RUNNER_TEMP/opus/lib" --filter ClockMappingTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HearPort-offline-clock
          path: ${{ runner.temp }}/offline-clock.json
