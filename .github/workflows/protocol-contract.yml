name: Protocol contract

on:
  push:
    paths: &contract_paths
      - "protocol/**"
      - "core/include/hearport/wire/**"
      - "core/src/wire/**"
      - "ios/HearPortReceiver/Sources/HearPortReceiver/AudioDatagram.swift"
      - "ios/HearPortReceiver/Sources/HearPortReceiver/ControlFraming.swift"
      - "ios/HearPortReceiver/Sources/HearPortReceiver/ControlMessages.swift"
      - "tests/fixtures/**"
      - "tests/reference/**"
      - "docs/validation-matrix.md"
      - "ios/HearPortApp/Resources/Info.plist"
      - ".github/workflows/protocol-contract.yml"
  pull_request:
    paths: *contract_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the control schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
          protoc -I protocol --descriptor_set_out="$RUNNER_TEMP/hearport.pb" protocol/hearport-v1.proto
      - run: python3 -m unittest discover -s tests/reference
