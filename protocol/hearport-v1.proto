syntax = "proto3";

package hearport.v1;

option optimize_for = LITE_RUNTIME;

// HearPort v1 control schema.
// The single bidirectional QUIC control stream is framed as:
//   uint32_be message_length || serialized ControlEnvelope

enum AuthMode {
  AUTH_MODE_UNSPECIFIED = 0; // invalid on the wire
  AUTH_MODE_REMEMBERED = 1;
  AUTH_MODE_PAIR = 2;
  AUTH_MODE_ONE_TIME = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0; // invalid on the wire
  ERROR_CODE_PROTOCOL = 1;
  ERROR_CODE_DATAGRAM_UNSUPPORTED = 2;
  ERROR_CODE_AUTH_FAILED = 3;
  ERROR_CODE_PAIRING_CLOSED = 4;
  ERROR_CODE_STREAM_STATE = 5;
  ERROR_CODE_AUDIO_UNAVAILABLE = 6;
  ERROR_CODE_INTERNAL = 7;
}

message ConnectRequest {
  AuthMode auth_mode = 1;      // AUTH_MODE_UNSPECIFIED is invalid

  // Required and exactly 16 bytes for AUTH_MODE_REMEMBERED.
  // MUST be empty for AUTH_MODE_PAIR and AUTH_MODE_ONE_TIME.
  bytes peer_id = 2;
  uint32 features = 3;          // Optional feature bitset; unknown bits are ignored.
}

message SessionReady {
  uint32 features = 1;          // Optional feature bitset; unknown bits are ignored.
}

message ReceiverReady {}

message DiagnosticsStart {
  bytes session_id = 1;         // exactly 16 bytes
  uint32 stream_id = 2;         // non-zero
  uint32 duration_seconds = 3;  // 60 through 600
}

message DiagnosticsEnd {
  bytes session_id = 1;         // exactly 16 bytes
  uint32 reason = 2;            // non-zero end-reason code
}

message DiagnosticsReportStart {
  bytes session_id = 1;         // exactly 16 bytes
  uint32 format_version = 2;    // non-zero
  uint32 total_bytes = 3;       // non-zero UTF-8 report length
  uint32 chunk_count = 4;       // non-zero
}

message DiagnosticsReportChunk {
  bytes session_id = 1;         // exactly 16 bytes
  uint32 chunk_index = 2;       // zero-based
  bytes chunk_data = 3;         // 1 through 60 KiB
}

message DiagnosticsReportEnd {
  bytes session_id = 1;         // exactly 16 bytes
}

message DiagnosticsReportReceived {
  bytes session_id = 1;         // exactly 16 bytes
}

// SPAKE2 first-pair / one-time flow.
message PairSpakeA {
  bytes spake_p_a = 1;               // P-256 SEC1 uncompressed, exactly 65 bytes
}

message PairSpakeB {
  bytes spake_p_b = 1;               // P-256 SEC1 uncompressed, exactly 65 bytes
}

message PairConfirmA {
  bytes confirmation = 1;             // exactly 32 bytes
}

message PairConfirmB {
  bytes confirmation = 1;             // exactly 32 bytes
}

// Sent only after successful AUTH_MODE_PAIR (remembered pairing).
message PairCredential {
  bytes peer_id = 1;                 // exactly 16 bytes
  bytes pair_secret = 2;             // exactly 32 bytes
}

// Remembered-device HMAC challenge.
message AuthChallenge {
  bytes nonce = 1;                   // exactly 32 bytes
}

message AuthResponse {
  bytes peer_id = 1;                 // exactly 16 bytes
  bytes mac = 2;                     // HMAC-SHA256, exactly 32 bytes
}

message StartStream {
  uint32 stream_id = 1;              // non-zero
}

message StartStreamAck {
  uint32 stream_id = 1;              // echo of the pending non-zero StartStream.stream_id
}

message ErrorMessage {
  ErrorCode code = 1;                // ERROR_CODE_UNSPECIFIED is invalid
  string message = 2;                // diagnostic only
}

message ControlEnvelope {
  oneof message {
    ConnectRequest connect_request = 1;
    SessionReady session_ready = 2;
    ErrorMessage error = 3;

    PairSpakeA pair_spake_a = 10;
    PairSpakeB pair_spake_b = 11;
    PairConfirmA pair_confirm_a = 12;
    PairConfirmB pair_confirm_b = 13;
    PairCredential pair_credential = 14;

    AuthChallenge auth_challenge = 20;
    AuthResponse auth_response = 21;

    StartStream start_stream = 30;
    StartStreamAck start_stream_ack = 31;

    ReceiverReady receiver_ready = 32;
    DiagnosticsStart diagnostics_start = 33;
    DiagnosticsEnd diagnostics_end = 34;
    DiagnosticsReportStart diagnostics_report_start = 35;
    DiagnosticsReportChunk diagnostics_report_chunk = 36;
    DiagnosticsReportEnd diagnostics_report_end = 37;
    DiagnosticsReportReceived diagnostics_report_received = 38;
  }
}
